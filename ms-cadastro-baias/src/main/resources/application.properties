spring.application.name=ms-cadastro-baias

# Porta: usa a variável PORT quando definida pelo ambiente (Cloud Run, Railway, etc.); 8081 local
# (evita conflito com o octopus-msusuario, que roda na 8080).
server.port=${PORT:8081}

# Lê o .env da raiz do repositório quando rodando local (./mvnw spring-boot:run). Ignorado se não existir.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Banco: valores vêm do .env. Compartilha o mesmo MySQL (Aiven) com os outros módulos.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false

# Schema gerido pelo Flyway com ddl-auto=validate. Como este módulo divide o banco com o msusuario,
# usa uma tabela de histórico própria para não colidir com o flyway_schema_history dele.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_baias
# O banco é compartilhado com o msusuario (já tem tabelas dele). Sem isto, o Flyway se recusa a rodar
# num schema não-vazio sem histórico próprio. baseline-on-migrate cria um marco inicial e aplica a V1 em diante.
spring.flyway.baseline-on-migrate=true
# Baseline na versão 0 para que a V1__baias.sql seja aplicada (o padrão 1 faria o Flyway pular a V1).
spring.flyway.baseline-version=0

# JWT: valida o token emitido pelo octopus-msusuario (mesmo JWT_SECRET). Este módulo não emite tokens.
app.security.jwt.secret=${JWT_SECRET}
