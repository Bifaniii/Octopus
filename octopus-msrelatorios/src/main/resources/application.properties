spring.application.name=octopus-msrelatorios
server.port=${PORT:8086}

# Lê o .env da pasta do módulo ou da raiz do repositório. Ignorado se não existir.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Só valida o token do msusuario: mesmo JWT_SECRET (base64, >= 48 bytes). Sem expiration-ms.
app.security.jwt.secret=${JWT_SECRET}

# Sem banco: os dados vêm dos outros módulos, chamados com o token de quem pediu o relatório.
app.servicos.usuarios-url=${MS_USUARIO_URL}
app.servicos.baias-url=${MS_BAIAS_URL}
app.servicos.medicacoes-url=${MS_MEDICACOES_URL}
app.servicos.internacoes-url=${MS_INTERNACAO_URL}
app.servicos.doses-url=${MS_DOSES_URL}

# Início de cada turno no relatório de doses (a noite vai até o início da manhã).
app.relatorios.turnos.manha=06:00
app.relatorios.turnos.tarde=12:00
app.relatorios.turnos.noite=18:00
