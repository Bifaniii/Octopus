spring.application.name=octopus-msusuario

# Lê o .env da raiz do repositório quando rodando local (./mvnw spring-boot:run). Ignorado se não existir.
spring.config.import=optional:file:../.env[.properties]

# Banco: valores vêm do .env (H2 em memória para dev, MySQL via docker-compose).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false

# Schema é gerido pelo Flyway (src/main/resources/db/migration/V<n>__<descricao>.sql, SQL do MySQL).
# O Hibernate só confere se as entidades batem com as tabelas; nunca cria nem altera nada.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo base64 (>= 48 bytes) obrigatório via JWT_SECRET; sem ele a aplicação não sobe.
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS}

# Admin inicial, criado só se ainda não existir nenhum ROLE_ADMIN.
app.bootstrap.admin.email=${ADMIN_EMAIL}
app.bootstrap.admin.senha=${ADMIN_SENHA}
app.bootstrap.admin.nome=${ADMIN_NOME}

# SMTP do e-mail de recuperação de senha. O host precisa estar definido, senão o Spring não cria o
# JavaMailSender e o EmailService derruba a aplicação na subida. Usuário e senha ficam vazios por
# padrão: a aplicação sobe, e só o envio falha enquanto o .env não estiver preenchido.
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# MAIL_DEBUG=true imprime a conversa SMTP no log, incluindo a resposta do servidor ao enviar.
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}
