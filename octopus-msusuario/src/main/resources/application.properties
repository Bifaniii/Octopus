spring.application.name=octopus-msusuario

# Lê o .env da raiz do repositório quando rodando local (./mvnw spring-boot:run). Ignorado se não existir.
spring.config.import=optional:file:../.env[.properties]

# Banco em memória para desenvolvimento. Para MySQL, sobrescreva via variáveis de ambiente.
spring.datasource.url=${DB_URL:jdbc:h2:mem:octopus_msusuario;DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Segredo base64 apenas para desenvolvimento local. Em produção, defina JWT_SECRET.
app.security.jwt.secret=${JWT_SECRET:csecbQgeJEvQ1T3lYpkG2gP6a1Iz5pP7FJwJNdsQi66IG+wxh7XyDmOFZYkH/xms}
app.security.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# Admin inicial, criado só se ainda não existir nenhum ROLE_ADMIN.
app.bootstrap.admin.email=${ADMIN_EMAIL:admin@octopus.local}
app.bootstrap.admin.senha=${ADMIN_SENHA:Admin@123}
app.bootstrap.admin.nome=${ADMIN_NOME:Administrador}
