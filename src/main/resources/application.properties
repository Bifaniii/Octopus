spring.application.name=octopus-msprescricao
server.port=${PORT:8084}

# Lê o .env da pasta do módulo ou da raiz do repositório. Ignorado se não existir.
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

# Banco: valores vêm do .env (MySQL do docker-compose do módulo).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false

# Schema é gerido pelo Flyway (db/migration/V<n>__<descricao>.sql). O Hibernate só confere, nunca altera.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# Tabela de histórico própria + baseline 0: o módulo pode dividir o MySQL com os outros em produção.
spring.flyway.table=flyway_schema_history_prescricao
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Só valida o token do msusuario: mesmo JWT_SECRET (base64, >= 48 bytes). Sem expiration-ms.
app.security.jwt.secret=${JWT_SECRET}

# Endereço do ms-internacao: valida a internação e avisa o início do tratamento. Vem do .env.
app.servicos.internacao-url=${MS_INTERNACAO_URL}

# Endereço do octopus-msmedications: interações proibidas da RN-03. Vem do .env.
app.servicos.medicacoes-url=${MS_MEDICACOES_URL}
