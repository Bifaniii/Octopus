spring.application.name=octopus-msmedications

# 8080 é do msusuario e 8081 do msbaias.
server.port=${PORT:8082}

# Rodando local, lê o .env deste módulo (ou o da raiz, se o repositório tiver um).
spring.config.import=optional:file:./.env[.properties],optional:file:../.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.open-in-view=false

# Histórico com nome próprio e baseline: o banco pode ser compartilhado com os outros módulos, e sem
# isso o Flyway se recusa a rodar num schema que já tem tabelas que não são dele.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.table=flyway_schema_history_medicacoes
spring.flyway.baseline-on-migrate=true
# Zero, senão o Flyway pula a V1.
spring.flyway.baseline-version=0

# Valida o token do octopus-msusuario; não emite.
app.security.jwt.secret=${JWT_SECRET}
