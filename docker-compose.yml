services:
  mysql:
    image: mysql:8.4
    container_name: octopus-mysql
    environment:
      MYSQL_DATABASE: octopus_msusuario
      MYSQL_USER: octopus
      MYSQL_PASSWORD: octopus
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uoctopus", "-poctopus"]
      interval: 5s
      timeout: 3s
      retries: 20

  msusuario:
    build: ./octopus-msusuario
    container_name: octopus-msusuario
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/octopus_msusuario
      DB_USERNAME: octopus
      DB_PASSWORD: octopus
      JWT_SECRET: ${JWT_SECRET:-csecbQgeJEvQ1T3lYpkG2gP6a1Iz5pP7FJwJNdsQi66IG+wxh7XyDmOFZYkH/xms}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@octopus.local}
      ADMIN_SENHA: ${ADMIN_SENHA:-Admin@123}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
