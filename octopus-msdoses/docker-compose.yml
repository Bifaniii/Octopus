services:
  mysql:
    image: mysql:8.4
    container_name: octopus-doses-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT:-3312}:3306"
    volumes:
      - mysql_data_doses:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  msdoses:
    build: .
    container_name: octopus-msdoses
    ports:
      - "8085:8085"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      # O mesmo valor usado pelo octopus-msusuario, senão o token dele não é aceito aqui.
      JWT_SECRET: ${JWT_SECRET}
      # Estoque: reserva ao agendar, devolve ao cancelar. De dentro do container, use host.docker.internal.
      MS_MEDICACOES_URL: ${MS_MEDICACOES_URL}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data_doses:
