name: CI/CD

# O GitHub só roda um workflow que exista na branch empurrada. Como cada branch é um microsserviço,
# cada uma tem o seu arquivo: mude só o bloco `env` abaixo.
# Os testes rodam em todo push. O deploy só acontece quando a <version> do pom.xml muda, ou seja,
# quando ainda não existe no GHCR uma imagem com a tag dessa versão.
on:
  push:
    branches: [feature/internacao]
  workflow_dispatch:

env:
  MODULO: octopus-msinternacao   # pasta do módulo, com o Dockerfile
  CONTAINER: internacao            # nome do container na EC2
  PORTA: 8083                 # porta do serviço (host e container)

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    outputs:
      versao: ${{ steps.versao.outputs.versao }}
      publicar: ${{ steps.registro.outputs.publicar }}
    defaults:
      run:
        working-directory: ${{ env.MODULO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes
        run: mvn -B verify

      - name: Versão do pom.xml
        id: versao
        run: echo "versao=$(mvn -q help:evaluate -Dexpression=project.version -DforceStdout)" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Se a imagem com essa versão já existe, o push só trouxe código sem subir a versão: não publica.
      - name: Versão já publicada?
        id: registro
        env:
          VERSAO: ${{ steps.versao.outputs.versao }}
        run: |
          IMAGEM="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octopus-${CONTAINER}"
          if docker manifest inspect "$IMAGEM:$VERSAO" > /dev/null 2>&1; then
            echo "publicar=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Versão $VERSAO já publicada; suba a <version> do pom.xml para fazer deploy."
          else
            echo "publicar=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Versão nova ($VERSAO): vai publicar."
          fi

  deploy:
    needs: test
    if: needs.test.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    # Um deploy por vez para o mesmo serviço; um push novo espera o anterior terminar.
    concurrency: deploy-${{ github.ref }}
    permissions:
      contents: read
      packages: write
    env:
      VERSAO: ${{ needs.test.outputs.versao }}
    steps:
      - uses: actions/checkout@v4

      - name: Nome da imagem
        run: echo "IMAGEM=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/octopus-${CONTAINER}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A imagem é gerada aqui, e não na EC2: o Maven não cabe na RAM de uma instância micro.
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.MODULO }}
          push: true
          tags: ${{ env.IMAGEM }}:${{ env.VERSAO }},${{ env.IMAGEM }}:latest

      # O secret guarda a chave em base64 (uma linha só): copiar do terminal quebrava a chave.
      - name: Chave SSH
        env:
          CHAVE_B64: ${{ secrets.EC2_SSH_KEY }}
        run: |
          echo "$CHAVE_B64" | base64 -d > "$RUNNER_TEMP/deploy_key"
          chmod 600 "$RUNNER_TEMP/deploy_key"
          ssh-keygen -y -f "$RUNNER_TEMP/deploy_key" > /dev/null && echo "Chave válida"

      - name: Atualizar o container na EC2
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
          NOVA: ${{ env.IMAGEM }}:${{ env.VERSAO }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key_path: ${{ runner.temp }}/deploy_key
          envs: GHCR_TOKEN,GHCR_USER,NOVA,CONTAINER,PORTA
          script: |
            set -e
            ENV_FILE="$HOME/octopus-env/$CONTAINER.env"
            [ -f "$ENV_FILE" ] || { echo "Falta $ENV_FILE na EC2"; exit 1; }

            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker pull "$NOVA"
            ANTIGA=$(docker inspect -f '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || true)

            subir() {
              docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
              docker run -d --name "$CONTAINER" --restart unless-stopped \
                -p "$PORTA:$PORTA" --env-file "$ENV_FILE" "$1"
            }

            subir "$NOVA"

            # Sem token, o serviço no ar responde 401. Espera até 3 minutos a subida do Spring.
            for i in $(seq 36); do
              CODIGO=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$PORTA/api/" || true)
              if [ "$CODIGO" = "401" ]; then
                echo "$CONTAINER no ar com $NOVA"
                docker logout ghcr.io >/dev/null
                docker image prune -af --filter "until=72h" >/dev/null || true
                exit 0
              fi
              sleep 5
            done

            echo "$CONTAINER não subiu. Últimas linhas do log:"
            docker logs --tail 60 "$CONTAINER" || true
            if [ -n "$ANTIGA" ]; then
              echo "Voltando para a versão anterior: $ANTIGA"
              subir "$ANTIGA"
            fi
            docker logout ghcr.io >/dev/null
            exit 1

      # O GHCR de repositório privado tem cota de armazenamento: guarda só as 5 versões mais recentes.
      - name: Limpar versões antigas no GHCR
        uses: actions/delete-package-versions@v5
        with:
          package-name: octopus-${{ env.CONTAINER }}
          package-type: container
          min-versions-to-keep: 5