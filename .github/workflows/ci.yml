name: CI

# O GitHub só roda um workflow que exista na branch empurrada. Cada branch é um microsserviço,
# então este arquivo é copiado entre elas mudando só o filtro de branch e o working-directory.
on:
  push:
    branches: [feature/prescricao]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octopus-msprescricao
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes
        run: mvn -B verify
